---
name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Skip unsupported repository
        if: ${{ vars.ENABLE_DEPENDENCY_REVIEW != 'true' }}
        run: |
          echo "Dependency review skipped because dependency graph support"
          echo "is not enabled for this repository."

      - name: Checkout
        if: ${{ vars.ENABLE_DEPENDENCY_REVIEW == 'true' }}
        uses: actions/checkout@v6

      - name: Dependency Review
        if: ${{ vars.ENABLE_DEPENDENCY_REVIEW == 'true' }}
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
