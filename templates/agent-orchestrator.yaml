# agent-orchestrator.yaml template
# Copy this file to the root of any project you want AO to manage, then edit:
#   1. projects.<key>.name     — human-readable project name
#   2. projects.<key>.repo     — GitHub owner/repo (required for batch-spawn)
#   3. projects.<key>.path     — absolute path to the repo inside WSL
#   4. projects.<key>.windowsMirror (optional) — Windows-side mirror in /mnt/... format
#   5. projects.<key>.defaultBranch
#   6. projects.<key>.sessionPrefix
# Then run:  ao start

port: 3000

defaults:
  # runtime: tmux is REQUIRED for the orchestrator to stay alive between turns.
  # runtime: process will cause the orchestrator session to die after the first response.
  runtime: tmux

  orchestrator:
    # Use claude-code if you want a smart planner for complex tasks.
    # Use codex for simpler/cheaper dispatching.
    agent: codex

  worker:
    # codex is the default worker. You can override per-task with `ao spawn --agent`.
    agent: codex

  workspace: worktree

  # AO core defaults already auto-route `ci-failed`, `changes-requested`,
  # and `bugbot-comments` back to the owning worker session.
  # If you override `reactions:` below, keep the PR feedback loop capped at 2 retries.
  notifiers: []

projects:
  my-project:
    name: My Project
    repo: your-github-user/your-repo
    path: /root/projects/my-project
    windowsMirror: /mnt/d/脚本程序/agent-orchestrator
    defaultBranch: main
    sessionPrefix: myproj
