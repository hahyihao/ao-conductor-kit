port: 3000

defaults:
  runtime: tmux
  orchestrator:
    agent: claude-code
  worker:
    agent: codex
  workspace: worktree
  notifiers:
    - webhook

notifiers:
  webhook:
    plugin: webhook
    url: http://127.0.0.1:8765

projects:
  ao-kit:
    name: AO Conductor Kit
    repo: hahyihao/ao-conductor-kit
    path: /root/projects/ao-conductor-kit
    defaultBranch: main
    sessionPrefix: kit

  ao-kit-slot-1:
    name: AO Kit Slot 1
    repo: hahyihao/ao-conductor-kit
    path: /root/lanes/kit-slot-1
    defaultBranch: lanes/slot-1
    sessionPrefix: kit1

